name: CI

on:
  push:
    branches: [develop, main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  LEFTHOOK: 0

jobs:
  quality:
    name: Lint, lista legacy, tipos y skills
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Ningún .env real versionado
        run: node scripts/block-env.mjs $(git ls-files)
      - run: npm run lint
      - run: npm run lint:legacy -- ${{ github.event.before }}
      - run: npm run typecheck
      - run: npm run skills:check

  unit:
    name: Unit, contrato y fuzz con cobertura
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:coverage
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage
          path: coverage/

  integration:
    name: Integración contra db-test
    runs-on: ubuntu-latest
    services:
      db-test:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: stock_test
        ports:
          - 5434:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d stock_test"
          --health-interval 2s --health-timeout 3s --health-retries 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:int

  build:
    name: Build contra db-test
    runs-on: ubuntu-latest
    services:
      db-test:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: stock_test
        ports:
          - 5434:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d stock_test"
          --health-interval 2s --health-timeout 3s --health-retries 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx dotenv -e .env.test -- npx drizzle-kit migrate
      - run: npx dotenv -e .env.test -- npm run build
